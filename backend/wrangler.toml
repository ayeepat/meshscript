# Cloudflare Worker config for the СМЭШ AI license backend.
# Free tier handles 100k requests/day, which is plenty for preorders.
#
# Before `wrangler deploy`:
#  1. `npx wrangler login`
#  2. Create the KV namespace:
#        npx wrangler kv namespace create LICENSES
#     Wrangler prints an `id = "…"` — paste it below.
#  3. Set the secrets (NOT in this file — see backend/README.md):
#        npx wrangler secret put ROBOKASSA_PASSWORD2         # ResultURL signature password from Robokassa
#        npx wrangler secret put ADMIN_SECRET
#        npx wrangler secret put RESEND_API_KEY              # optional
#        npx wrangler secret put TELEGRAM_BOT_TOKEN          # optional
#        npx wrangler secret put OWNER_LICENSE_KEY           # optional dev-bypass key
#        npx wrangler secret put SUPPORT_CHAT_ID             # your numeric Telegram id (support bot)
#        npx wrangler secret put TELEGRAM_WEBHOOK_SECRET     # random string (support bot webhook auth)
#  4. `npx wrangler deploy`
#  5. Point your custom domain at the worker (Cloudflare → Workers → Triggers).

name = "smesh-licenses"
main = "src/worker.js"
compatibility_date = "2025-01-15"

# License rows. Keyed by license key string. Value is the JSON in licenses.js.
[[kv_namespaces]]
binding = "LICENSES"
id = "ab3e52d938304a4c909766cb2033834a"

# Non-secret config. Override in the Cloudflare dashboard for production.
[vars]
# Must match the hash algorithm selected in Robokassa technical settings.
ROBOKASSA_HASH_ALGO = "MD5"
# Optional hard IP filter for ResultURL. Signature verification remains required.
ROBOKASSA_ENFORCE_IP_ALLOWLIST = "false"
# Email "from" address. Must be a verified sender in your Resend account.
EMAIL_FROM = "СМЭШ AI <license@smesh.app>"
# Product type when no pricing threshold below matches (or none is set).
DEFAULT_LICENSE_TYPE = "lifetime"
# Anti-abuse: hard cap on how many devices a single license can activate.
DEVICE_LIMIT = "3"

# ── Pricing → plan (planFromAmount in worker.js) ──────────────────────────────
# All amounts in RUB, all OPTIONAL. Leave unset to keep everything lifetime.
#   amount >= LIFETIME_MIN_RUB                     → lifetime (expires_at = null)
#   SUBSCRIPTION_MIN_RUB <= amount < LIFETIME_MIN  → subscription for SUBSCRIPTION_DAYS
# Monthly 199₽, lifetime 990₽:
SUBSCRIPTION_MIN_RUB = "199"
LIFETIME_MIN_RUB = "990"
# Subscription length in days (default 30 when unset).
SUBSCRIPTION_DAYS = "30"

# ── Payment floor (SET THIS BEFORE THE PAY PAGE GOES LIVE) ────────────────────
# Hard minimum: signed ResultURL notifications below this amount NEVER issue a
# key (the worker still returns OK{InvId} so Robokassa does not retry forever).
# Falls back to the lowest plan floor above when unset; with everything unset
# there is NO floor and the worker logs a warning on every issuance.
MIN_PAYMENT_RUB = "199"
