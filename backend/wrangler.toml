# Cloudflare Worker config for the СМЭШ AI license backend.
# Free tier handles 100k requests/day, which is plenty for preorders.
#
# Before `wrangler deploy`:
#  1. `npx wrangler login`
#  2. Create the KV namespace:
#        npx wrangler kv namespace create LICENSES
#     Wrangler prints an `id = "…"` — paste it below.
#  3. Set the secrets (NOT in this file — see backend/README.md):
#        npx wrangler secret put ROBOKASSA_PASSWORD1_PRODUCTION # payment-init signature password
#        npx wrangler secret put ROBOKASSA_PASSWORD2_PRODUCTION # ResultURL/OpState signature password
#        npx wrangler secret put ROBOKASSA_PASSWORD3_PRODUCTION # refund JWT password
#        npx wrangler secret put ADMIN_SECRET
#        npx wrangler secret put STATS_SECRET              # read-only dashboard token, distinct from ADMIN_SECRET
#        npx wrangler secret put RESEND_API_KEY              # optional
#        npx wrangler secret put TELEGRAM_BOT_TOKEN          # optional
#        npx wrangler secret put OWNER_LICENSE_KEY           # optional dev-bypass key
#        npx wrangler secret put SUPPORT_CHAT_ID             # your numeric Telegram id (support bot)
#        npx wrangler secret put TELEGRAM_WEBHOOK_SECRET     # random string (support bot webhook auth)
#        npx wrangler secret put CHECKOUT_CAPABILITY_SECRET # >=32 random bytes, Worker-only checkout HMAC
#        npx wrangler secret put CHECKOUT_PROMO_CODE         # optional private test/discount code
#        npx wrangler secret put AI_PROXY_API_KEY            # only if the legacy Worker proxy is explicitly enabled
#        npx wrangler secret put INGEST_KEY                  # >=32 random bytes: /verify telemetry HMAC + VPS /t/ai
#  4. Apply every schema migration BEFORE deploying payment code:
#        npx wrangler d1 migrations apply smesh-analytics --remote
#  5. First deploy: `npx wrangler deploy --keep-vars --var RUNTIME_WRITE_EPOCH:1`
#  6. Confirm smeshapi.site is bound to this worker (Cloudflare → Workers → Triggers).

name = "smesh-licenses"
main = "src/worker.js"
compatibility_date = "2025-01-15"
# Production intentionally permits dashboard-only non-secret overrides (see
# [vars] below). Preserve variables not represented in this file on every
# ordinary deploy; tracked keys still update from this configuration.
keep_vars = true

# Custom domain (dedicated apex, registered for the RU-block workaround: the
# shared *.workers.dev suffix is DPI-blocked in Russia). Cloudflare creates the
# DNS record + TLS cert automatically on deploy, since the smeshapi.site zone
# lives in this same account. The extension client points BACKEND_URL here.
routes = [
  { pattern = "smeshapi.site", custom_domain = true }
]

# Cron: re-drives failed license deliveries (delivery_outbox) and stranded
# referral credits until they land — the durable retry channel behind the
# payment webhook's ack. Each run is bounded (LIMIT) and idempotent.
[triggers]
crons = ["*/5 * * * *"]

# License rows. Keyed by license key string. Value is the JSON in licenses.js.
[[kv_namespaces]]
binding = "LICENSES"
id = "cc972aa483a741ff96bce115f84ab4c1"

# Analytics: devices / events / purchases + atomic telemetry abuse budgets
# (see schema.sql + src/analytics.js).
# Created with `npx wrangler d1 create smesh-analytics`. Apply tracked changes with:
#   npx wrangler d1 migrations apply smesh-analytics --remote
[[d1_databases]]
binding = "DB"
database_name = "smesh-analytics"
database_id = "ccacb16f-f77e-4017-91f6-1c642d7a9b9a"
# Deployed schema changes go through `wrangler d1 migrations apply` (numbered
# files in migrations/; schema.sql stays the fresh-install snapshot — see its
# header for the change flow).
migrations_dir = "migrations"

# Non-secret config. Override in the Cloudflare dashboard for production.
[vars]
# Normal deployments are writable. The backup runbook overrides this exact
# value to "true" in a 100% maintenance deployment, then explicitly restores
# false after both KV and D1 artifacts validate.
BACKUP_MAINTENANCE = "false"
# RUNTIME_WRITE_EPOCH is deliberately NOT pinned in this file. It is a
# dashboard/CLI-managed non-secret variable which must equal the durable D1
# row; the backup protocol increments it. keep_vars=true preserves it across
# ordinary deploys, while readiness and every mutation fail closed if missing
# or mismatched.
# Must match the hash algorithm selected in Robokassa technical settings.
ROBOKASSA_HASH_ALGO = "SHA256"
# Exact MerchantLogin confirmed in the active Robokassa shop.
ROBOKASSA_MERCHANT_LOGIN = "smeshai"
# This production Worker accepts only production orders and production
# credentials. Test mode belongs in a separate Worker + D1 database; never
# swap test Password#2 into this deployment.
PAYMENT_ENVIRONMENT = "production"
ROBOKASSA_OUT_CURRENCY_LABEL = "RUB"
ROBOKASSA_REFUND_HASH_ALGO = "HS256"
# Every hosted checkout carries its browser return routes in the Password #1
# signature. The authoritative standard ResultURL is configured in the
# Robokassa cabinet; ResultUrl2 uses a different JWS callback format and is not
# sent to the classic ResultURL handler.
ROBOKASSA_SUCCESS_URL2 = "https://smeshai.xyz/checkout/success/"
ROBOKASSA_FAIL_URL2 = "https://smeshai.xyz/checkout/"
# The cabinet confirms Robocheki SMZ for this NPD shop. Send itemized receipt
# data to Robokassa; omit SNO so the confirmed cabinet profile remains the
# authority. The offer grants a non-exclusive software licence and access is
# issued immediately after payment confirmation, so the receipt uses RIA/full
# settlement rather than an advance or a generic physical-good classification.
ROBOKASSA_FISCALIZATION_MODE = "provider"
ROBOKASSA_RECEIPT_TAX = "none"
ROBOKASSA_RECEIPT_PAYMENT_METHOD = "full_payment"
ROBOKASSA_RECEIPT_PAYMENT_OBJECT = "intellectual_activity"
# Optional hard IP filter for ResultURL. Signature verification remains required.
ROBOKASSA_ENFORCE_IP_ALLOWLIST = "true"
# Email "from" address. Must be a verified sender in your Resend account.
EMAIL_FROM = "СМЭШ AI <license@smesh.app>"
# Product type when no pricing threshold below matches (or none is set).
DEFAULT_LICENSE_TYPE = "subscription"
# Anti-abuse: hard cap on how many devices a single license can activate.
DEVICE_LIMIT = "1"

# ── Pricing → plan (planFromAmount in worker.js) ──────────────────────────────
# All amounts in RUB, all OPTIONAL. Leave unset to keep everything lifetime.
#   amount >= LIFETIME_MIN_RUB                     → lifetime (expires_at = null)
#   SUBSCRIPTION_MIN_RUB <= amount < LIFETIME_MIN  → subscription for SUBSCRIPTION_DAYS
# The paid site sells finite subscriptions only. A former public `lifetime`
# order code is explicitly unavailable; the 9-month plan is a subscription.
SUBSCRIPTION_MIN_RUB = "149"
LIFETIME_MIN_RUB = "0"
# Exact server-owned catalog prices frozen into payment_orders at checkout.
# The *_MIN_RUB values above remain only for historical compatibility.
SUBSCRIPTION_PRICE_RUB = "149"
LIFETIME_PRICE_RUB = "0"
# Subscription length in days (default 30 when unset).
SUBSCRIPTION_DAYS = "30"

# Public checkout catalog. Prices/durations are frozen into payment_orders;
# the browser sends plan/promo labels, never an amount or Telegram id. The
# optional promo code is a Worker secret and must never be committed here.
MONTHLY_PRICE_RUB = "149"
MONTHLY_DAYS = "30"
SCHOOL_YEAR_PRICE_RUB = "999"
# Nine paid months (273 days); no automatic summer renewal or summer charge.
SCHOOL_YEAR_DAYS = "273"
CHECKOUT_PROMO_MONTH_PRICE_RUB = "10"
CHECKOUT_TELEGRAM_BOT_USERNAME = "smeshaibot"
# The old browser-supplied contact route bypasses Telegram ownership binding.
LEGACY_PAYMENT_ORDER_ENABLED = "false"

# ── Referral program (referrals.js; all OPTIONAL, defaults shown) ────────────
# Friend enters your code at checkout and PAYS → you earn this many free days.
# Rewards are capped server-side at 30 total days per referral code.
REFERRAL_PAID_DAYS = "7"
# The paying friend's OWN new subscription is extended by this percent
# (30-day plan → 33 days). Subscriptions only; lifetime can't be extended.
REFERRAL_BUYER_BONUS_PCT = "10"
# Daily per-IP budget for the invite-code endpoint (/referral/code). "0" off.
REFERRAL_IP_DAILY_LIMIT = "30"

# Pseudonymous analytics event/inactive-device retention. Runtime clamps this
# privacy boundary to 30..365 days; user-triggered /t/delete remains immediate.
ANALYTICS_RETENTION_DAYS = "90"

# ── AI proxy (ai-proxy.js): Qwen/DeepSeek for licensed users, no user keys ───
# The production extension uses the VPS proxy, which is the sole quota
# authority. Keep the legacy Worker route retired unless an operator is
# deliberately running a separately reviewed emergency migration.
AI_PROXY_LEGACY_ENABLED = "false"
# Requires the AI_PROXY_API_KEY secret (see above) + the proxy_quota table
# (schema.sql). Daily request caps, all env-tunable without a redeploy:
# OpenAI-compatible base URL. 302.AI resells Qwen + DeepSeek with no KYC —
# switched from DashScope International 2026-07-07 (Alibaba wanted passport
# KYC for a direct key). ai-proxy.js appends /chat/completions itself.
AI_PROXY_BASE_URL = "https://api.302.ai/v1"
# Models can be changed without code if the reseller renames/drops a model.
# All three verified live on 302.AI 2026-07-07 (fallbacks via product pages).
PROXY_QWEN_MODEL = "qwen3.7-plus"
# Used for TEXT-ONLY requests. qwen-plus is text-only and, on a live probe,
# answered a vision request with HTTP 200 + a WRONG guess instead of erroring
# — never let it stand in for a vision request (see PROXY_QWEN_VISION_FALLBACK_MODELS).
PROXY_QWEN_FALLBACK_MODELS = "qwen-vl-plus,qwen-plus"
# Used instead of the above when the request carries an image (ai-proxy.js
# modelChoices). qwen-vl-plus is vision-capable (verified live); deliberately
# excludes qwen-plus.
PROXY_QWEN_VISION_FALLBACK_MODELS = "qwen-vl-plus"
PROXY_DEEPSEEK_MODEL = "deepseek-v4-flash"
# per-license per-provider…
PROXY_QWEN_DAILY = "80"
PROXY_DEEPSEEK_DAILY = "150"
# …and the global circuit breaker across ALL users. If tripped, students get a
# friendly "перегружен" error and the day's spend stops growing, no matter what.
PROXY_GLOBAL_DAILY = "3000"

# ── Payment floor (SET THIS BEFORE THE PAY PAGE GOES LIVE) ────────────────────
# Hard minimum: signed ResultURL notifications below this amount NEVER issue a
# key (the worker still returns OK{InvId} so Robokassa does not retry forever).
# Falls back to the lowest plan floor above when unset; with everything unset
# there is NO floor and the worker logs a warning on every issuance.
MIN_PAYMENT_RUB = "10"
